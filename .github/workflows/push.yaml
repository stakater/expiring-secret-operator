name: Push

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - 'docs/'
      - 'examples/'
      - 'hack/'

permissions:
  contents: write
  pull-requests: write

jobs:
  push-operator:
    name: Push Operator
    uses: stakater/.github/.github/workflows/operator_push.yaml@298c7980eb2dad7cc8cef118fe5c1307c2a8c2a5 # main
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
      CONTAINER_REGISTRY_URL: ghcr.io/stakater
      CONTAINER_REGISTRY_USERNAME: stakater-user
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
      #STAKATER_AB_REPOS: ${{ secrets.STAKATER_AB_REPOS }}
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      #ENABLE_STAKATER_AB_GIT_AUTH: true
      #ENABLE_CHART_PUSH: true
      # Tag master/dev builds as vX.Y.Z-<sha> (a SemVer pre-release) instead of
      # a clean vX.Y.Z. A clean tag then means a real release only, so nothing
      # mistakes a dev build for a release (e.g. Renovate pinning the deploy
      # manifest to an unreleased image). Matches mto-dependencies-operator.
      TAGGING_STRATEGY: "commit-sha"
      GO_VERSION: "1.27.3"
