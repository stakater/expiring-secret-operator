name: Pull Request

on:
  pull_request:
    branches:
      - main
      - master
      - release
    paths-ignore:
      - '*.md'
      - '.github/readme.md'
      - 'docs/'
      - 'examples/'
      - 'hack/'

permissions:
  contents: read
  pull-requests: write

jobs:
  operator-pull-request:
    name: Operator Pull Request
    uses: stakater/.github/.github/workflows/operator_pull_request.yaml@36e623348c20da24510dfb06bb4a66c73e003c67 # main
    secrets:
      CONTAINER_REGISTRY_URL: ghcr.io/stakater
      CONTAINER_REGISTRY_USERNAME: stakater-user
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      #ENABLE_STAKATER_AB_GIT_AUTH: true
      #ENABLE_CHART_PUSH: true
      GO_VERSION: "1.27.3"
