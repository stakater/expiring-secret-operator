name: Pull request for documentation changes

on:
  pull_request:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'README.md'
      - '.markdownlint.yaml'
      - '.vale.ini'
      - '**/*.md'
      - '!docs/superpowers/**'

jobs:
  doc_qa:
    uses: stakater/.github/.github/workflows/pull_request_doc_qa.yaml@ae4c65e9d10b541f301d4b8e24921319586d0980 # main
    with:
      MD_CONFIG: .github/md_config.json
      DOC_SRC: README.md
      MD_LINT_CONFIG: .markdownlint.yaml
