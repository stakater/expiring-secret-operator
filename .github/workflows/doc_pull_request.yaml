name: Pull request for documentation changes

on:
  pull_request:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'README.md'
      - '.markdownlint.yaml'
      - '.vale.ini'
      - '**/*.md'
      - '!docs/superpowers/**'

jobs:
  doc_qa:
    uses: stakater/.github/.github/workflows/pull_request_doc_qa.yaml@4b120b91baba04b73d3bde21519b3d9f810b3229 # main
    with:
      MD_CONFIG: .github/md_config.json
      DOC_SRC: README.md
      MD_LINT_CONFIG: .markdownlint.yaml
