name: Check Coverage
on:
  push:
    branches: 
      - "master"
  pull_request:
    branches: 
      - "master"

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  code_coverage:
    name: Operator Pull Request
    uses: stakater/.github/.github/workflows/pull_request_coverage.yaml@298c7980eb2dad7cc8cef118fe5c1307c2a8c2a5 # main
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      TARGET_BRANCH: master
      GO_VERSION: "1.27.3"
