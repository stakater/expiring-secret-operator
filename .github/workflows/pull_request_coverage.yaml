name: Check Coverage
on:
  push:
    branches: 
      - "master"
  pull_request:
    branches: 
      - "master"

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  code_coverage:
    name: Operator Pull Request
    uses: stakater/.github/.github/workflows/pull_request_coverage.yaml@c8fb297b5d664e9a9bc1c7abdf0e89580d39eb9d # main
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      TARGET_BRANCH: master
      GO_VERSION: "1.27.3"
