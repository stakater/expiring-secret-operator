name: Check Coverage
on:
  push:
    branches: 
      - "master"
  pull_request:
    branches: 
      - "master"

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  code_coverage:
    name: Operator Pull Request
    uses: stakater/.github/.github/workflows/pull_request_coverage.yaml@36e623348c20da24510dfb06bb4a66c73e003c67 # main
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      TARGET_BRANCH: master
      GO_VERSION: "1.27.3"
