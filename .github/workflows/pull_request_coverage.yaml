name: Check Coverage
on:
  push:
    branches: 
      - "master"
  pull_request:
    branches: 
      - "master"

jobs:
  code_coverage:
    name: Operator Pull Request
    uses: stakater/.github/.github/workflows/pull_request_coverage.yaml@8c767c78c2333c8395ae094338451dedff9183d6 # main
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      TARGET_BRANCH: master
      GO_VERSION: "1.27.3"
