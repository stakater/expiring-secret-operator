name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "30 8 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Code is analyzed from source; no build step needed.
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
