serviceaccount.yaml:
  #- search: "name: expiring-secret-operator"
  #  replace: "name: {{ include \"expiring-secret-operator.fullname\" . }}"

  - search: "---\n{{ if .Values.serviceAccount.create }}\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: {{ include \"expiring-secret-operator.serviceAccountName\" . }}"
    replace: "---\n{{ if .Values.serviceAccount.create }}\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: {{ include \"expiring-secret-operator.serviceAccountName\" . }}-metrics-reader"
  #  regex: true
