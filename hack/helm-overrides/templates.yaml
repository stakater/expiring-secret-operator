# Helm template overrides
# Applied after helmify generates the chart
#
# Format:
#   <filename>:
#     - search: "<pattern>"
#       replace: "<replacement>"
#       regex: true/false (optional, default false)
#
# Note: Use \n for newlines in multi-line replacements

controller-manager-metrics-monitor.yaml:
  #- search: "name: expiring-secret-operator-controller-manager-metrics-monitor"
  #  replace: "name: {{ include \"expiring-secret-operator.fullname\" . }}-controller-manager-metrics-monitor"
  - search: "name: expiring-secret-operator"
    replace: "name: {{ include \"expiring-secret-operator.fullname\" . }}"

deployment.yaml:
  - search: "name: expiring-secret-operator"
    replace: "name: {{ include \"expiring-secret-operator.fullname\" . }}"

  - search: "\\n(\\s+)name: manager\\n(\\s+)readinessProbe:"
    replace: |-

      $1name: manager
      $1ports:
      $1- containerPort: 8443
      $1  name: https
      $1  protocol: TCP
      $2readinessProbe:
    regex: true

expired-secret-rules.yaml:
  #- search: "name: expiring-secret-operator-expired-secret-rules"
  #  replace: "name: {{ include \"expiring-secret-operator.fullname\" . }}-expired-secret-rules"
  - search: "name: expiring-secret-operator"
    replace: "name: {{ include \"expiring-secret-operator.fullname\" . }}"

  # Prometheus alert annotations use Go-template `{{ $labels.* }}` refs that
  # collide with Helm templating — Helm would try to resolve `$labels` at
  # install time and fail. Escape them so Helm emits the literal braces and
  # Prometheus (not Helm) interprets them at alert time. Matches across the
  # YAML line-fold helmify introduces, hence \s* around the name.
  - search: '\{\{\s*(\$labels\.[a-z_]+)\s*\}\}'
    replace: '{{ "{{" }} ${1} {{ "}}" }}'
    regex: true

